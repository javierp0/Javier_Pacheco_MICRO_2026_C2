# Mosquitto local para Porton Seguro IoT.
# 1883: MQTT TCP para ESP32 y herramientas CLI.
# 9001: MQTT WebSocket para la app movil Expo/React Native.

persistence true
persistence_location ./mosquitto-data/

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

log_type error
log_type warning
log_type notice
log_type information
